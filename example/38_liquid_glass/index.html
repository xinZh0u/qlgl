<div id="root">
  <!-- 背景照片由 `--image <path>` 在运行期解码、注册成 "photo"。
       外层负责滚动，内层图片比窗口高 —— 滚轮上下移动背景，玻璃固定在中间。 -->
  <div id="photo-wrap">
    <img id="photo" src="photo" alt="">
  </div>

  <div class="stage">
    <!-- 玻璃圆盘：8% 白底 + 外侧 2px 白环 + 一圈淡投影 -->
    <div class="glass" id="glass">
      <!-- 中间的 +：两条圆头白条，竖的那条转 90° -->
      <div class="bar h"></div>
      <div class="bar v"></div>
    </div>
    <div class="hint" id="hint">滚轮上下滚动背景 · 悬停玻璃看折射 · 点一下改这行字</div>
  </div>
</div>
