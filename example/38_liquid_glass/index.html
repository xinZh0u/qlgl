<div id="root">
  <!-- 水彩背景在根元素的 background-image 里；这一层只是几团慢慢流动的薄雾。
       两者都**不模糊** —— 糊不糊是玻璃自己的事。 -->
  <div class="scene">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="blob b5"></div>
  </div>

  <div class="stage">
    <!-- 玻璃圆盘：8% 白底 + 2px 亮边 + 一圈淡投影 -->
    <div class="glass" id="glass">
      <!-- 中间的 +：两条圆头白条，竖的那条转 90° -->
      <div class="bar h"></div>
      <div class="bar v"></div>
    </div>
    <div class="hint" id="hint">悬停玻璃看折射 · 点一下改这行字</div>
  </div>
</div>
