<div id="root">
  <div class="h1">transform: translate 的百分比</div>
  <div class="sub">百分比相对元素自身的边框盒（x 用宽、y 用高）。位移不进布局，下面这些移动不会挤走兄弟节点。灰块 = 盒子原来的位置，蓝/青块 = 位移后。</div>

  <div class="row">
    <div class="cell">
      <div class="frame"><div class="box center">-50%,-50%</div></div>
      <div class="cap">① 向左上各挪自身一半（45 / 17）</div>
    </div>
    <div class="cell">
      <div class="frame"><div class="box right">100%</div></div>
      <div class="cap">② 右移一整段自身宽（90）</div>
    </div>
    <div class="cell">
      <div class="frame"><div class="box down">0,100%</div></div>
      <div class="cap">③ 下移一整段自身高（34）</div>
    </div>
  </div>

  <div class="row2">
    <div class="cell">
      <div class="frame"><div class="box half">50%</div></div>
      <div class="cap">④ 右移半个宽（45）：压到边上</div>
    </div>
    <div class="cell">
      <div class="frame"><div class="box neg">-25%</div></div>
      <div class="cap">⑤ 负值：左移 1/4 宽（22）</div>
    </div>
    <div class="cell">
      <div class="frame t"><div class="tall">10%,-50%</div></div>
      <div class="cap">⑥ 高盒子：y 按高度算（-25）</div>
    </div>
  </div>
</div>
